name: Cancel stuck Pages deployment

on:
  workflow_dispatch:

permissions:
  pages: write

jobs:
  cancel:
    runs-on: ubuntu-latest
    steps:
      - name: Cancel old Pages deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST --include \
            "repos/${GITHUB_REPOSITORY}/pages/deployments/dc4e2c980b9b8747033aad747ad0d153ad711ade/cancel"
